services:
  github-backup:
    build: .
    image: ghcr.io/umputun/github-backup-docker:latest
    container_name: "github-backup"
    hostname: "github-backup"
    restart: always

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    environment:
      - GITHUB_USER=        # comma-separated GitHub usernames, e.g. myuser,anotheruser
      - GITHUB_ORG=         # comma-separated GitHub orgs (token must have org access)
      - TOKEN=${GITHUB_ACCESS_TOKEN}
      - MAX_BACKUPS=10
      - TIME_ZONE=America/Chicago
      - BACKUP_OPTIONS=--all --private --gists
    volumes:
      - ./var:/srv/var
