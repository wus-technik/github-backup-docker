services:
  github-backup:
    image: ghcr.io/wus-technik/github-backup-docker:stable
    container_name: github-backup
    hostname: github-backup
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      GITHUB_USER: ""       # comma-separated GitHub account names
      GITHUB_ORG: ""        # comma-separated organizations
      TOKEN_FILE: /run/secrets/github_token
      MAX_BACKUPS: "10"     # successful snapshots per account
      MAX_FAILED_BACKUPS: "3"
      TIME_ZONE: Europe/Berlin
      BACKUP_OPTIONS: --all --private --gists
      COMPRESSION: "no"
      # NOTIFY_WEBHOOK_URL_FILE: /run/secrets/notify_webhook
    secrets:
      - github_token
      # - notify_webhook
    volumes:
      - ./var:/srv/var

secrets:
  github_token:
    file: ./secrets/github_token
  # notify_webhook:
  #   file: ./secrets/notify_webhook
