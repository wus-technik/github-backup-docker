name: Build and Push Container

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      matrix: ${{ steps.plan.outputs.matrix }}
      publish: ${{ steps.plan.outputs.publish }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve sources and channels
        id: plan
        run: python3 ci/plan.py

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Validate scripts and compose
        run: |
          for script in exec.sh ci/smoke-test.sh ops/update.sh; do sh -n "$script"; done
          shellcheck exec.sh ci/smoke-test.sh ops/update.sh
          python3 -m compileall -q backup.py secure_github_backup.py git_credential.py ci
          docker compose config --quiet
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build OCI archive with attestations
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          no-cache: true
          build-args: PACKAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ matrix.sha }}
            org.opencontainers.image.version=${{ matrix.version || matrix.sha }}
      - name: Expand OCI layout for the scanner
        env:
          ARCHIVE: ${{ runner.temp }}/image.tar
          LAYOUT: ${{ runner.temp }}/image-layout
        run: |
          mkdir "$LAYOUT"
          tar -xf "$ARCHIVE" -C "$LAYOUT"
      - name: Scan the archive before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image-layout
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          timeout: 10m
          cache: false
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
      - name: Load the same OCI image for smoke tests
        env:
          ARCH: ${{ matrix.arch }}
          ARCHIVE: ${{ runner.temp }}/image.tar
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          case "$ARCH" in
            armv7) skopeo --override-arch arm --override-variant v7 copy "oci-archive:$ARCHIVE" docker-daemon:github-backup-docker:test ;;
            *) skopeo --override-arch "$ARCH" copy "oci-archive:$ARCHIVE" docker-daemon:github-backup-docker:test ;;
          esac
      - name: Smoke, security and restore tests
        timeout-minutes: 20
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        run: ./ci/smoke-test.sh github-backup-docker:test
      - name: Upload the verified archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.id }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: image-publish
    # Serialize alias promotion, preserving queued releases as well as schedules.
    concurrency:
      group: image-promotion
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified archives and promote current channels
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          python3 ci/publish.py
