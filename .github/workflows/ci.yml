name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint shell and Python and validate deployment
        run: |
          shellcheck exec.sh ci/smoke-test.sh ops/update.sh
          for script in exec.sh ci/smoke-test.sh ops/update.sh; do sh -n "$script"; done
          python3 -m compileall -q backup.py secure_github_backup.py git_credential.py ci
          python3 -m unittest discover -v -s ci -p test_pipeline.py
          docker compose config --quiet
