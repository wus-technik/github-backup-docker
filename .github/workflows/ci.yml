name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
    - name: check out code
      uses: actions/checkout@v4

    - name: install shellcheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck

    - name: check shell syntax
      run: sh -n exec.sh

    - name: lint shell scripts
      run: shellcheck exec.sh

    - name: validate compose file
      env:
        GITHUB_ACCESS_TOKEN: dummy-token
      run: docker compose config --quiet

    - name: set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: build docker image
      run: docker build --pull --tag github-backup-docker:test .

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
    steps:
    - name: check out code
      uses: actions/checkout@v4

    - name: set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3

    - name: available platforms
      run: echo ${{ steps.buildx.outputs.platforms }}

    - name: build and deploy master image to ghcr.io and dockerhub
      if: ${{ github.ref == 'refs/heads/master' }}
      env:
        GITHUB_PACKAGE_TOKEN: ${{ secrets.PKG_TOKEN }}
        DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        USERNAME: ${{ github.actor }}
        GITHUB_SHA: ${{ github.sha}}
        GITHUB_REF: ${{ github.ref}}
      run: |
        ref="$(echo ${GITHUB_REF} | cut -d'/' -f3)"
        echo GITHUB_REF - $ref
        echo ${GITHUB_PACKAGE_TOKEN} | docker login ghcr.io -u ${USERNAME} --password-stdin
        echo ${DOCKER_HUB_TOKEN} | docker login -u ${USERNAME} --password-stdin
        docker buildx build --push \
            --build-arg CI=github --build-arg GITHUB_SHA=${GITHUB_SHA} --build-arg GIT_BRANCH=${ref} \
            --platform linux/amd64,linux/arm/v7,linux/arm64 \
            -t ghcr.io/${USERNAME}/github-backup-docker:${ref} -t ${USERNAME}/github-backup-docker:${ref} .

    - name: deploy tagged (latest) to ghcr.io and dockerhub
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      env:
        GITHUB_PACKAGE_TOKEN: ${{ secrets.PKG_TOKEN }}
        DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        USERNAME: ${{ github.actor }}
        GITHUB_SHA: ${{ github.sha}}
        GITHUB_REF: ${{ github.ref}}
      run: |
        ref="$(echo ${GITHUB_REF} | cut -d'/' -f3)"
        echo GITHUB_REF - $ref
        echo ${GITHUB_PACKAGE_TOKEN} | docker login ghcr.io -u ${USERNAME} --password-stdin
        echo ${DOCKER_HUB_TOKEN} | docker login -u ${USERNAME} --password-stdin
        docker buildx build --push \
            --build-arg CI=github --build-arg GITHUB_SHA=${GITHUB_SHA} --build-arg GIT_BRANCH=${ref} \
            --platform linux/amd64,linux/arm/v7,linux/arm64 \
            -t ghcr.io/${USERNAME}/github-backup-docker:${ref} -t ghcr.io/${USERNAME}/github-backup-docker:latest \
            -t ${USERNAME}/github-backup-docker:${ref} -t ${USERNAME}/github-backup-docker:latest .
